# =============================================================
# CHMath-wiki 站点配置
# 技术栈: mkdocs + mkdocs-material (Material for MkDocs)
# 文档:   https://squidfunk.github.io/mkdocs-material/
# =============================================================

site_name: CHMath-wiki
site_description: >-
  CHMath-wiki：一个旨在通过提供精准、简洁且抓住问题本质的数学内容，
  来提升数学理解能力的中文资料库。
site_author: CHMath-wiki Team
site_url: https://finparker.github.io/CHMath-wiki/
copyright: Copyright &copy; 2025 CHMath-wiki Team &mdash; 采用 <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh">CC BY-SA 4.0</a> 协议

# 严格模式: 将警告视为错误, 防止坏链接/坏引用被发布
strict: true

# 仓库
repo_name: CHMath-wiki
repo_url: https://github.com/FinParker/CHMath-wiki
edit_uri: edit/main/docs/

# -------------------------------------------------------------
# 主题
# -------------------------------------------------------------
theme:
  name: material
  language: zh
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  font: false   # 使用系统字体(对中文渲染更可靠, 不依赖 Google Fonts)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.indexes        # 章节标题链接到该章节的 index 页
    - navigation.top            # 回到顶部按钮
    - navigation.tracking       # 滚动时 URL 跟随当前锚点
    - navigation.footer         # 页脚上一页/下一页
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索结果高亮
    - search.share              # 搜索分享
    - content.code.annotate     # 代码注解
    - content.code.copy         # 代码复制按钮
    - content.tabs.link         # 内容选项卡联动
    - content.tooltips          # 工具提示

# -------------------------------------------------------------
# 插件
# -------------------------------------------------------------
plugins:
  # 站点搜索 (中文分词 + 拼音搜索由 language: zh 提供)
  - search:
      lang: zh
      separator: '[\s\u200b\-\.]'
  # 标签系统
  - tags:
      listings_map:
        # 全站标签索引, 由 docs/tags.md 中的 <!-- material/tags tags --> 指令渲染
        tags: {}
  # 旧链接重定向(保持 URL 稳定)
  - redirects:
      redirect_maps:
        'discrete_mathematics/concepts/basics.md': 'notation/symbols.md'
        'discrete_mathematics/set_theory.md': 'foundations/set_theory/basics.md'
        'discrete_mathematics/mathematical_logic.md': 'foundations/logic/propositional_logic.md'
        'discrete_mathematics/algebraic_structure/algebraic_system.md': 'algebra/structures/algebraic_system.md'
        'discrete_mathematics/algebraic_structure/semigroup.md': 'algebra/structures/semigroup.md'
        'discrete_mathematics/algebraic_structure/group.md': 'algebra/structures/group.md'
        'discrete_mathematics/algebraic_structure/ring.md': 'algebra/structures/ring.md'
        'discrete_mathematics/algebraic_structure/field.md': 'algebra/structures/field.md'
        'discrete_mathematics/algebraic_structure/polynomial.md': 'algebra/structures/polynomial.md'
        'symbols.md': 'notation/symbols.md'
        'specification.md': 'intro/writing-guide.md'
        'category/basics/范畴论初步.md': 'foundations/category_theory/morphisms.md'
        'tricks/阶乘.md': 'tricks/factorial.md'
        'tricks/有理分式的拆分.md': 'tricks/partial_fractions.md'
        'high_school_mathematics/集合/集合.md': 'elementary/sets.md'
        'high_school_mathematics/函数/函数.md': 'elementary/functions.md'
        'high_school_mathematics/不等式/不等式.md': 'elementary/inequalities.md'
        'high_school_mathematics/数论/数论.md': 'elementary/number_theory.md'
        'high_school_mathematics/等式与方程/等式与方程.md': 'elementary/equations.md'
        'high_school_mathematics/简单逻辑/简单逻辑.md': 'elementary/logic.md'
  # 最后更新日期
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      enable_git_follow: false   # 文件移动后 git 历史追踪可能产生时间倒序告警, 关闭跟随

# -------------------------------------------------------------
# 导航
# -------------------------------------------------------------
nav:
  - 首页: index.md
  - 入门:
    - intro/index.md
    - 关于本项目: intro/about.md
    - 内容路线图: intro/roadmap.md
    - 贡献指南: intro/contribute.md
    - 写作规范: intro/writing-guide.md
  - 符号表: notation/index.md
  - 数学基础:
    - foundations/index.md
    - 数理逻辑:
      - foundations/logic/index.md
      - 命题逻辑: foundations/logic/propositional_logic.md
      - 谓词逻辑: foundations/logic/predicate_logic.md
    - 集合论:
      - foundations/set_theory/index.md
      - 基本概念: foundations/set_theory/basics.md
      - 集合运算: foundations/set_theory/operations.md
      - 关系: foundations/set_theory/relations.md
      - 函数: foundations/set_theory/functions.md
      - 基数与势: foundations/set_theory/cardinality.md
      - 序数: foundations/set_theory/ordinals.md
      - ZFC 公理系统: foundations/set_theory/zfc.md
      - 选择公理: foundations/set_theory/axiom_of_choice.md
    - 范畴论:
      - foundations/category_theory/index.md
      - 范畴: foundations/category_theory/categories.md
      - 态射与同构: foundations/category_theory/morphisms.md
      - 函子: foundations/category_theory/functors.md
      - 自然变换: foundations/category_theory/natural_transformations.md
      - 泛性质与极限: foundations/category_theory/universal_properties.md
      - Yoneda 引理: foundations/category_theory/yoneda.md
  - 代数:
    - algebra/index.md
    - 代数结构:
      - algebra/structures/index.md
      - 代数系统: algebra/structures/algebraic_system.md
      - 半群与幺半群: algebra/structures/semigroup.md
      - 群: algebra/structures/group.md
      - 环: algebra/structures/ring.md
      - 域: algebra/structures/field.md
      - 多项式: algebra/structures/polynomial.md
    - 线性代数:
      - algebra/linear/index.md
      - 向量空间: algebra/linear/vector_spaces.md
      - 线性映射: algebra/linear/linear_maps.md
      - 矩阵: algebra/linear/matrices.md
      - 行列式: algebra/linear/determinants.md
      - 特征值与特征向量: algebra/linear/eigenvalues.md
  - 分析:
    - analysis/index.md
    - 微积分:
      - analysis/calculus/index.md
      - 极限: analysis/calculus/limits.md
      - 导数: analysis/calculus/derivatives.md
      - 积分: analysis/calculus/integrals.md
      - 数列与级数: analysis/calculus/sequences_series.md
    - 实分析:
      - analysis/real/index.md
      - 实数公理: analysis/real/real_numbers.md
      - 实数的拓扑: analysis/real/topology_of_r.md
      - 连续函数: analysis/real/continuity.md
      - 微分学: analysis/real/differentiation.md
      - Riemann 积分: analysis/real/integration.md
    - 复分析:
      - analysis/complex/index.md
      - 复数: analysis/complex/complex_numbers.md
      - 全纯函数: analysis/complex/holomorphic_functions.md
  - 几何:
    - geometry/index.md
    - 初等几何: geometry/elementary.md
    - 圆锥曲线: geometry/conic_sections.md
  - 拓扑学:
    - topology/index.md
    - 拓扑空间: topology/topological_spaces.md
    - 连通性: topology/connectedness.md
    - 紧致性: topology/compactness.md
  - 数论:
    - number_theory/index.md
    - 初等数论基础: number_theory/basic.md
    - 素数: number_theory/primes.md
    - 模运算: number_theory/modular.md
  - 离散数学:
    - discrete_mathematics/index.md
    - 组合数学: discrete_mathematics/combinatorics.md
    - 图论: discrete_mathematics/graph_theory.md
    - 自动机理论: discrete_mathematics/automata_theory.md
  - 概率与统计:
    - probability_statistics/index.md
    - 概率论基础: probability_statistics/basics.md
    - 随机变量: probability_statistics/random_variables.md
  - 应用数学: applied_math/index.md
  - 解题技巧:
    - tricks/index.md
    - 阶乘: tricks/factorial.md
    - 有理分式的拆分: tricks/partial_fractions.md
  - 初等数学(草稿):
    - elementary/index.md
    - 集合: elementary/sets.md
    - 函数: elementary/functions.md
    - 不等式: elementary/inequalities.md
    - 数论: elementary/number_theory.md
    - 等式与方程: elementary/equations.md
    - 简单逻辑: elementary/logic.md
  - 项目开发: development/index.md

# -------------------------------------------------------------
# Markdown 扩展
# -------------------------------------------------------------
markdown_extensions:
  - admonition                    # 提示框 (note/warning/tip/...)
  - attr_list                     # 属性列表 (配合 tooltips 等)
  - def_list                      # 定义列表
  - footnotes                     # 脚注
  - md_in_html                    # HTML 块内 Markdown
  - meta                          # 文档元数据 (front matter)
  - tables                        # 表格
  - toc:
      permalink: true             # 标题锚点链接
      toc_depth: 3
  - pymdownx.arithmatex:          # 数学公式 (配合 MathJax 3)
      generic: true
  - pymdownx.betterem             # 更强的强调解析
  - pymdownx.caret                # 上标
  - pymdownx.critic               # 修订标记
  - pymdownx.details              # 详情/折叠块
  - pymdownx.emoji:               # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:           # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite         # 行内代码高亮
  - pymdownx.keys                 # 键位符号
  - pymdownx.magiclink            # 自动链接
  - pymdownx.mark                 # 标记
  - pymdownx.snippets             # 片段插入
  - pymdownx.superfences:         # 增强围栏代码块
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.tabbed:              # 选项卡
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:            # 任务列表
      custom_checkbox: true
  - pymdownx.tilde                # 下标/删除线

# -------------------------------------------------------------
# 数学渲染: MathJax 3 (通过 pymdownx.arithmatex 转换 $...$ / $$...$$)
# -------------------------------------------------------------
extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
