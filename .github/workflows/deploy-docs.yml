name: Deploy Docs to GitHub Pages

on:
  # 触发条件：推送到 main 分支时运行
  push:
    branches:
      - main
  # 也允许手动触发
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 部署 Pages 的权限
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 抑制 mkdocs-material 关于 MkDocs 2.0 的横幅噪音
      NO_MKDOCS_2_WARNING: "true"

    steps:
      # 1. 检出代码（保留完整历史，供 git-revision-date 插件使用）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. 安装依赖（requirements.txt 已锁定精确版本）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 严格构建校验（坏链接/警告即失败）
      - name: Build site (strict)
        run: mkdocs build --strict

      # 5. 构建并部署文档
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
